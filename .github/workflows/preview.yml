name: Refresh hidden preview

# The live site (main) also builds this branch into a hidden subfolder.
# A push here re-runs the main deployment so the preview stays current.
on:
  push:
    branches: ["zola"]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run jekyll.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
