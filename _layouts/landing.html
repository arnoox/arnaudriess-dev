<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.ffi_title | escape }}</title>
    <meta name="description" content="{{ page.ffi_description | escape }}">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/ffi.css" | relative_url }}">
    <link rel="icon" href="{{ "/favicon.svg" | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    {%- if site.umami_website_id -%}
    <script defer src="https://cloud.umami.is/script.js" data-website-id="{{ site.umami_website_id }}"></script>
    {%- endif -%}
  </head>
  <body>
    {%- include header.html -%}
    <main class="ffi" aria-label="Content">
      {{ content }}
    </main>
    {%- include footer.html -%}
  </body>
</html>
